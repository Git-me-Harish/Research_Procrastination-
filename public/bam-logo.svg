<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140" width="320" height="140">
  <defs>
    <!-- Yellow starburst background -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FFD23F"/>
      <stop offset="100%" stop-color="#FF6B35"/>
    </radialGradient>
    <!-- BAM text gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FFD23F"/>
      <stop offset="100%" stop-color="#FF6B35"/>
    </linearGradient>
    <filter id="hardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="6" dy="6" in="SourceAlpha" result="offset"/>
      <feFlood flood-color="#0A0A0A"/>
      <feComposite in2="offset" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Starburst shape -->
  <polygon
    points="160,5 180,40 220,30 210,70 250,80 215,105 240,135 195,125 175,160 155,125 110,135 135,105 95,80 135,70 125,30 165,40"
    fill="url(#bgGrad)"
    stroke="#0A0A0A"
    stroke-width="5"
    stroke-linejoin="round"
    filter="url(#hardShadow)"
  />

  <!-- BAM text -->
  <text
    x="160" y="100"
    font-family="Bangers, Impact, sans-serif"
    font-size="78"
    font-weight="900"
    fill="url(#textGrad)"
    stroke="#0A0A0A"
    stroke-width="4"
    stroke-linejoin="round"
    text-anchor="middle"
    letter-spacing="2"
    transform="rotate(-4 160 80)"
  >BAM!</text>

  <!-- Small POW! accent -->
  <text
    x="280" y="40"
    font-family="Bangers, Impact, sans-serif"
    font-size="22"
    fill="#FF4757"
    stroke="#0A0A0A"
    stroke-width="2"
    text-anchor="middle"
    transform="rotate(15 280 40)"
  >POW!</text>

  <!-- Small ZAP! accent -->
  <text
    x="40" y="120"
    font-family="Bangers, Impact, sans-serif"
    font-size="18"
    fill="#4361EE"
    stroke="#0A0A0A"
    stroke-width="2"
    text-anchor="middle"
    transform="rotate(-12 40 120)"
  >ZAP!</text>
</svg>
